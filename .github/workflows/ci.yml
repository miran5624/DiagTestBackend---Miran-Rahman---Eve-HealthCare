name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evehealthcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/evehealthcare_test
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 1h
      WEBHOOK_SECRET: webhook_secret
      PORT: 3000

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Setup Prisma
      run: |
        cd backend
        npx prisma generate
        npx prisma migrate reset --force

    - name: Run verification (lint, typecheck, tests)
      run: npm run verify
